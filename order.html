<style>

  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); padding-bottom:40px;}
  .topbar{background:var(--teal); color:white; padding:18px; }
  .topbar h1{margin:2px 0 0; font-size:19px; font-weight:800;}
  .topbar .sub{font-size:12.5px; opacity:0.9; margin-top:4px;}
  .wrap{padding:16px 18px;}
  .section-label{font-size:12px; font-weight:800; color:var(--teal-dark); letter-spacing:1px; margin:14px 0 6px;}
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line-border);
    font-size:14.5px; background:white;
  }
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:10px 16px; border-radius:12px; border:1.5px solid var(--line-border);
    background:white; font-weight:700; font-size:14px; color:var(--ink-soft); cursor:pointer;
  }
  .chip.sel{background:var(--teal); border-color:var(--teal); color:white;}
  .primary-btn{
    width:100%; background:var(--teal); color:white; border:none; padding:14px;
    border-radius:12px; font-size:15px; font-weight:800; cursor:pointer; margin-top:18px;
  }
  .primary-btn:disabled{background:#c9c2b5;}
  .banner{
    background:var(--gold-light); border:1px solid var(--gold); border-radius:10px;
    padding:10px 12px; font-size:12px; color:#6b4f10; line-height:1.5; margin-top:14px;
  }
  .status-badge{
    display:inline-flex; align-items:center; gap:6px; background:var(--teal-light);
    color:var(--teal-dark); padding:8px 14px; border-radius:999px; font-weight:800; font-size:13.5px;
  }
  .loading{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}
  .placeholder-card{
    margin-top:20px; background:white; border:1.5px dashed var(--line-border);
    border-radius:14px; padding:24px; text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.7;
  }
  .search-bar{
    margin-top:10px; background:white; border:1.5px solid var(--line-border); border-radius:12px;
    padding:10px 14px; font-size:14px; display:flex; align-items:center; gap:8px;
  }
  .search-bar input{border:none; outline:none; flex:1; font-size:14px; background:transparent; padding:0;}
  .cat-row{display:flex; gap:8px; padding:10px 0 2px; overflow-x:auto;}
  .cat-pill{
    white-space:nowrap; padding:6px 14px; border-radius:999px; background:white;
    border:1px solid var(--line-border); font-size:12.5px; color:var(--ink-soft); font-weight:600; cursor:pointer;
  }
  .cat-pill.sel{background:var(--gold-light); border-color:var(--gold); color:#7a5b13;}
  .item-card{
    margin:8px 0; background:white; border:1.5px solid var(--line-border); border-radius:14px;
    padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .item-card.selected{border-color:var(--teal); background:var(--teal-light);}
  .item-info .name{font-size:14.5px; font-weight:700;}
  .item-info .spec{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .add-btn{
    width:30px; height:30px; border-radius:8px; border:1.5px solid var(--teal); color:var(--teal);
    background:white; font-size:16px; font-weight:800; cursor:pointer; flex-shrink:0;
  }
  .qtybox-wrap{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .qty-box{
    min-width:44px; text-align:center; padding:7px 10px; border-radius:10px; background:var(--teal);
    color:white; font-weight:800; font-size:14.5px; cursor:pointer;
  }
  .qty-input{
    width:60px; text-align:center; padding:6px 4px; border-radius:10px; border:1.5px solid var(--gold);
    font-weight:800; font-size:15px; background:var(--gold-light);
  }
  .remove-btn{width:24px; height:24px; border-radius:50%; border:none; background:transparent; color:var(--ink-soft); font-size:15px; cursor:pointer;}
  .footer-bar{
    position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid var(--line-border);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center;
    justify-content:space-between; gap:12px;
  }
  .footer-bar .cart-info .n{font-weight:800; color:var(--teal-dark); font-size:15px;}
  .footer-bar .cart-info .l{font-size:11px; color:var(--ink-soft);}
  .footer-bar .primary-btn{width:auto; margin-top:0; max-width:220px; flex:1;}
  .empty-hint{padding:24px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .history-card{
    background:white; border:1.5px solid var(--line-border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
  }
  .history-card .hc-head{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;
  }
  .history-card .hc-id{font-size:12.5px; font-weight:800; color:var(--teal-dark);}
  .history-card .hc-meta{font-size:11px; color:var(--ink-soft);}
  .history-card .hc-status{
    font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px;

  .status-已出貨{background:var(--teal-light); color:var(--teal-dark);}
  .status-已完成{background:#e2f0e6; color:#3d6b4a;}
  .history-card .hc-items{font-size:12.5px; color:var(--ink); line-height:1.7;}
  .history-card .hc-items .short{color:#c0503d; font-weight:700;}
</style>
</head>

<div id="bind-form" class="wrap" style="display:none;">

  <button class="primary-btn" id="bind-submit-btn">完成設定</button>
</div>

<div id="main-content" class="wrap" style="display:none; padding-bottom:90px;">
  <div class="status-badge">👤 <span id="user-name-display"></span>　<span id="user-role-display"></span></div>

  <div class="section-label">叫貨門市（每次叫貨都要選）</div>
  <div class="chip-row" id="store-row">
    <div class="chip sel" data-store="正氣店">正氣店</div>
    <div class="chip" data-store="鐵花館">鐵花館</div>
  </div>

  <button id="history-toggle-btn" style="margin-top:10px; width:100%; padding:10px; border-radius:10px; border:1px solid var(--line-border); background:white; color:var(--teal-dark); font-weight:700; font-size:13px; cursor:pointer;">📋 查看本門市最近叫貨紀錄</button>
  <div id="history-panel" style="display:none; margin-top:8px;"></div>

  <div class="search-bar">🔍 <input type="text" id="search-input" placeholder="搜尋品項名稱或編碼"></div>
  <div class="cat-row" id="cat-row"></div>

  <div class="section-label" style="padding-top:6px;">品項（點數字可直接輸入數量）</div>
  <div id="product-list"></div>
  <div id="empty-hint" class="empty-hint" style="display:none;">找不到符合的品項，換個關鍵字試試</div>
</div>

<div id="cart-footer" class="footer-bar" style="display:none;">
  <div class="cart-info">
    <div class="n" id="cart-count">0 項</div>
    <div class="l">已選擇的叫貨項目</div>
  </div>
  <button class="primary-btn" id="submit-order-btn" disabled>送出叫貨</button>
</div>

// 呼叫 GAS 的 JSON API（GET，用於讀取）
function apiGet(action, params, onSuccess, onError, retriesLeft){
  if (retriesLeft === undefined) retriesLeft = 2;
  var qs = 'action=' + encodeURIComponent(action);
  for (var k in params) { qs += '&' + k + '=' + encodeURIComponent(params[k]); }
  fetch(API_URL + '?' + qs)
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.ok) onSuccess(json.data);
      else if (onError) onError(json.error);
    })
    .catch(function(err){
      if (retriesLeft > 0) {
        setTimeout(function(){ apiGet(action, params, onSuccess, onError, retriesLeft - 1); }, 800);
      } else if (onError) onError(err);
    });
}

// 呼叫 GAS 的 JSON API（POST，用於寫入；用 text/plain 避免瀏覽器發出 CORS 預檢請求）
function apiPost(action, payload, onSuccess, onError, retriesLeft){
  if (retriesLeft === undefined) retriesLeft = 2;
  var body = Object.assign({ action: action }, payload);
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.ok) onSuccess(json.data);
      else if (onError) onError(json.error);
    })
    .catch(function(err){
      if (retriesLeft > 0) {
        setTimeout(function(){ apiPost(action, payload, onSuccess, onError, retriesLeft - 1); }, 800);
      } else if (onError) onError(err);
    });
}

document.getElementById('bind-role-row').addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#bind-role-row .chip').forEach(function(c){ c.classList.remove('sel'); });
  chip.classList.add('sel');
  selectedRole = chip.dataset.role;
});

document.getElementById('bind-submit-btn').addEventListener('click', function(){
  var name = document.getElementById('bind-name').value.trim();
  if (!name) { alert('請輸入姓名'); return; }
  this.disabled = true;
  this.textContent = '設定中...';
  var btn = this;
  apiPost('saveUserBinding', { userId: currentUserId, name: name, role: selectedRole }, function(result){
    showMainContent(result.name, result.role);
  }, function(err){
    btn.disabled = false;
    btn.textContent = '完成設定';
    alert('設定失敗，請再試一次：' + err);
  });
});

function showMainContent(name, role){
  document.getElementById('bind-form').style.display = 'none';
  document.getElementById('user-name-display').textContent = name;
  document.getElementById('user-role-display').textContent = '（' + role + '人員）';
  document.getElementById('main-content').style.display = 'block';
  document.getElementById('cart-footer').style.display = 'flex';
  window.currentUserName = name;
  renderCats();
  renderProductList();
  bindStoreRow();
}

function renderCats(){
  var el = document.getElementById('cat-row');
  el.innerHTML = CATS.map(function(c){
    return '<div class="cat-pill' + (c===selectedCat ? ' sel' : '') + '" data-cat="' + c + '">' + c + '</div>';
  }).join('');
  el.querySelectorAll('.cat-pill').forEach(function(pill){
    pill.addEventListener('click', function(){
      selectedCat = pill.dataset.cat;
      renderCats();
      renderProductList();
    });
  });
}

function bindStoreRow(){
  document.getElementById('store-row').addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#store-row .chip').forEach(function(c){ c.classList.remove('sel'); });
    chip.classList.add('sel');
    selectedStore = chip.dataset.store;
    if (document.getElementById('history-panel').style.display !== 'none') {
      loadHistory();
    }
  });
  document.getElementById('search-input').addEventListener('input', function(e){
    searchKeyword = e.target.value.trim().toLowerCase();
    renderProductList();
  });
  document.getElementById('history-toggle-btn').addEventListener('click', function(){
    var panel = document.getElementById('history-panel');
    if (panel.style.display === 'none') {
      panel.style.display = 'block';
      loadHistory();
    } else {
      panel.style.display = 'none';
    }
  });
}

function loadHistory(){
  var panel = document.getElementById('history-panel');
  panel.innerHTML = '<div class="empty-hint">載入中...</div>';
  apiGet('getOrdersByStore', { store: selectedStore, limit: 5 }, function(orders){
    if (!orders || orders.length === 0) {
      panel.innerHTML = '<div class="empty-hint">' + selectedStore + ' 目前還沒有叫貨紀錄</div>';
      return;
    }
    panel.innerHTML = orders.map(function(o){
      var itemsHtml = o.items.map(function(it){
        var shortFlag = '';
        if (it.shipped !== '' && it.shipped !== null && Number(it.shipped) < Number(it.qty)) {
          shortFlag = ' <span class="short">（出貨' + it.shipped + '，缺' + (it.qty - it.shipped) + '）</span>';
        }
        return it.name + ' x' + it.qty + shortFlag;
      }).join('<br>');
      var statusClass = 'status-' + o.status;
      return '<div class="history-card">' +
        '<div class="hc-head">' +
        '<span class="hc-id">' + o.orderId + '</span>' +
        '<span class="hc-status ' + statusClass + '">' + o.status + '</span>' +
        '</div>' +
        '<div class="hc-meta">' + o.time + '　叫貨人：' + o.orderer + '</div>' +
        '<div class="hc-items" style="margin-top:6px;">' + itemsHtml + '</div>' +
        '</div>';
    }).join('');
  }, function(err){
    panel.innerHTML = '<div class="empty-hint">載入失敗，請再試一次</div>';
  });
}

function filteredProducts(){
  return PRODUCTS.filter(function(p){
    if (selectedCat !== '全部' && p.g !== selectedCat) return false;
    if (searchKeyword && p.n.toLowerCase().indexOf(searchKeyword) === -1 && p.c.toLowerCase().indexOf(searchKeyword) === -1) return false;
    return true;
  });
}

function qtyBoxHtml(code, qty){
  if (qty > 0) {
    return '<div class="qtybox-wrap">' +
      '<div class="qty-box" id="qbox-' + code + '" onclick="openQtyInput(\'' + code + '\')">' + qty + '</div>' +
      '<button class="remove-btn" onclick="removeItem(\'' + code + '\')">×</button>' +
      '</div>';
  }
  return '<button class="add-btn" onclick="addItem(\'' + code + '\')">＋</button>';
}

function renderProductList(){
  var list = filteredProducts();
  var el = document.getElementById('product-list');
  var emptyHint = document.getElementById('empty-hint');
  if (list.length === 0) {
    el.innerHTML = '';
    emptyHint.style.display = 'block';
    return;
  }
  emptyHint.style.display = 'none';
  el.innerHTML = list.slice(0, 60).map(function(p){
    var qty = cart[p.c] || 0;
    return '<div class="item-card' + (qty>0?' selected':'') + '">' +
      '<div class="item-info"><div class="name">' + p.n + '</div>' +
      '<div class="spec">' + (p.s || p.u) + '　' + p.c + '</div></div>' +
      qtyBoxHtml(p.c, qty) +
      '</div>';
  }).join('');
}

function addItem(code){
  cart[code] = (cart[code]||0) + 1;
  renderProductList();
  updateCartFooter();
}
function removeItem(code){
  delete cart[code];
  renderProductList();
  updateCartFooter();
}
function openQtyInput(code){
  var box = document.getElementById('qbox-' + code);
  if (!box) return;
  var current = box.textContent.trim();
  box.outerHTML = '<input type="number" inputmode="numeric" pattern="[0-9]*" class="qty-input" id="qbox-' + code + '" value="' + current + '" onblur="commitQtyInput(\'' + code + '\')" onkeydown="if(event.key===\'Enter\'){this.blur();}">';
  var input = document.getElementById('qbox-' + code);
  input.focus();
  input.select();
}
function commitQtyInput(code){
  var input = document.getElementById('qbox-' + code);
  if (!input) return;
  var val = parseInt(input.value, 10);
  if (isNaN(val) || val < 0) val = 0;
  if (val === 0) { delete cart[code]; } else { cart[code] = val; }
  renderProductList();
  updateCartFooter();
}

function updateCartFooter(){
  var n = Object.keys(cart).length;
  document.getElementById('cart-count').textContent = n + ' 項';
  document.getElementById('submit-order-btn').disabled = n === 0;
}

document.getElementById('submit-order-btn').addEventListener('click', function(){
  var codes = Object.keys(cart);
  if (codes.length === 0) return;
  var items = codes.map(function(c){
    var p = PRODUCTS.find(function(x){ return x.c === c; });
    return { code: p.c, name: p.n, spec: p.s, unit: p.u, qty: cart[c] };
  });
  var btn = this;
  btn.disabled = true;
  btn.textContent = '送出中...';
  apiPost('submitOrder', {
    userId: currentUserId,
    name: window.currentUserName,
    store: selectedStore,
    items: JSON.stringify(items)
  }, function(result){
    var itemsHtml = items.map(function(it){
      return '<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line-border); font-size:13.5px;">' +
        '<span>' + it.name + '</span><span style="font-weight:800; color:var(--teal-dark);">x ' + it.qty + '</span></div>';
    }).join('');
    document.getElementById('main-content').innerHTML =
      '<div class="placeholder-card" style="border-style:solid; border-color:var(--teal); text-align:left;">' +
      '<div style="text-align:center; margin-bottom:10px;">✅ 叫貨已送出！</div>' +
      '<div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;">單號：' + result.orderId + '　門市：' + selectedStore + '</div>' +
      itemsHtml +
      '<div style="text-align:center; margin-top:14px; font-size:12px; color:var(--ink-soft);">倉庫/工廠已收到通知，備貨完成後會通知您到貨時間。<br>可以到上方「查看本門市最近叫貨紀錄」隨時核對這筆內容。</div>' +
      '</div>';
    document.getElementById('cart-footer').style.display = 'none';
  }, function(err){
    btn.disabled = false;
    btn.textContent = '送出叫貨';
    alert('送出失敗，請再試一次：' + err);
  });
});

function init(){
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    return liff.getProfile();
  }).then(function(profile){
    if (!profile) return;
    currentUserId = profile.userId;
    document.getElementById('loading').style.display = 'none';

    apiGet('getUserBinding', { userId: currentUserId }, function(binding){
      if (binding) {
        showMainContent(binding.name, binding.role);
      } else {
        document.getElementById('bind-form').style.display = 'block';
      }
    }, function(err){
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').textContent = '連線失敗，請重新整理再試一次';
    });
  }).catch(function(err){
    document.getElementById('loading').textContent = '請在 LINE App 內開啟此頁面';
  });
}

init();
</script>
</body>
</html>
