<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>門市驗收</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --teal:#0f6f66; --teal-dark:#0a4f49; --teal-light:#e4f0ee;
    --gold:#c9932e; --gold-light:#f7ecd4; --cream:#faf6ee;
    --ink:#2b2622; --ink-soft:#6b6259; --line-border:#e6ddce;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); padding-bottom:40px; line-height:1.5;}
  .topbar{background:var(--teal); color:white; padding:18px; }
  .topbar h1{margin:2px 0 0; font-size:21px; font-weight:800;}
  .topbar .sub{font-size:15.5px; opacity:0.9; margin-top:4px;}
  .wrap{padding:16px 18px;}
  .section-label{font-size:16.5px; font-weight:800; color:var(--teal-dark); letter-spacing:1px; margin:14px 0 6px;}
  input[type=text]{
    width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line-border);
    font-size:17.5px; background:white;
  }
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:12px 18px; border-radius:12px; border:1.5px solid var(--line-border);
    background:white; font-weight:700; font-size:15.5px; color:var(--ink-soft); cursor:pointer;
  }
  .chip.sel{background:var(--teal); border-color:var(--teal); color:white;}
  .primary-btn{
    width:100%; background:var(--teal); color:white; border:none; padding:16px;
    border-radius:12px; font-size:17px; font-weight:800; cursor:pointer; margin-top:18px;
  }
  .primary-btn:disabled{background:#c9c2b5;}
  .banner{
    background:var(--gold-light); border:1px solid var(--gold); border-radius:10px;
    padding:10px 12px; font-size:16.5px; color:#6b4f10; line-height:1.5; margin-top:14px;
  }
  .status-badge{
    display:inline-flex; align-items:center; gap:6px; background:var(--teal-light);
    color:var(--teal-dark); padding:8px 14px; border-radius:999px; font-weight:800; font-size:16.5px;
  }
  .loading{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:15.5px;}
  .placeholder-card{
    margin-top:20px; background:white; border:1.5px dashed var(--line-border);
    border-radius:14px; padding:24px; text-align:center; color:var(--ink-soft); font-size:16.5px; line-height:1.7;
  }
  .order-card{
    background:white; border:1.5px solid var(--line-border); border-radius:14px; padding:14px; margin-bottom:14px;
  }
  .order-card .oc-head{margin-bottom:10px;}
  .order-card .oc-id{font-size:16.5px; font-weight:800; color:var(--teal-dark);}
  .order-card .oc-meta{font-size:16.5px; color:var(--ink-soft); margin-top:2px;}
  .receive-item{
    border-top:1px dashed var(--line-border); padding:10px 0; display:flex; align-items:center; gap:12px;
  }
  .check-circle{
    width:30px; height:30px; border-radius:50%; border:2px solid var(--line-border);
    display:flex; align-items:center; justify-content:center; font-size:15.5px; color:white;
    flex-shrink:0; cursor:pointer;
  }
  .check-circle.on{background:#4a7d5c; border-color:#4a7d5c;}
  .receive-info{flex:1;}
  .receive-info .name{font-weight:700; font-size:15.5px;}
  .receive-info .meta{font-size:17.5px; color:var(--ink-soft); margin-top:2px;}
  .qtybox-wrap{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .qty-box{
    min-width:50px; text-align:center; padding:9px 12px; border-radius:10px; background:var(--teal);
    color:white; font-weight:800; font-size:15.5px; cursor:pointer;
  }
  .qty-input{
    width:62px; text-align:center; padding:7px 4px; border-radius:10px; border:1.5px solid var(--gold);
    font-weight:800; font-size:15.5px; background:var(--gold-light);
  }
  .receiver-auto{
    margin-top:10px; background:var(--teal-light); border:1.5px solid var(--teal); border-radius:12px;
    padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .receiver-name{font-size:16.5px; font-weight:800; color:var(--teal-dark); display:flex; align-items:center; gap:8px;}
  .receiver-tag{font-size:16.5px; font-weight:700; background:white; color:var(--teal-dark); padding:2px 8px; border-radius:999px;}
  .switch-link{background:none; border:none; color:var(--teal-dark); font-size:16.5px; font-weight:700; text-decoration:underline; cursor:pointer;}
  .receive-submit-btn{
    width:100%; background:var(--teal); color:white; border:none; padding:15px;
    border-radius:12px; font-size:16.5px; font-weight:800; cursor:pointer; margin-top:12px;
  }
  .receive-submit-btn:disabled{background:#c9c2b5;}
  .history-card{
    background:white; border:1.5px solid var(--line-border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
  }
  .history-card .hc-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .history-card .hc-id{font-size:15.5px; font-weight:800; color:var(--teal-dark);}
  .history-card .hc-meta{font-size:17.5px; color:var(--ink-soft);}
  .history-card .hc-items{font-size:15.5px; color:var(--ink); line-height:1.7; margin-top:6px;}
</style>
</head>
<body>

<div class="topbar">
  <div style="font-size:17.5px; opacity:0.85; letter-spacing:1px; text-transform:uppercase;">LINE｜門市驗收</div>
  <h1>到貨驗收</h1>
  <div class="sub">逐項確認 → 自動寫入門市進貨單</div>
</div>

<div id="loading" class="loading">載入中...</div>

<div id="bind-form" class="wrap" style="display:none;">
  <div class="section-label">您的姓名</div>
  <input type="text" id="bind-name" placeholder="請輸入姓名">

  <div class="section-label">您的角色</div>
  <div class="chip-row" id="bind-role-row">
    <div class="chip sel" data-role="門市">門市人員</div>
    <div class="chip" data-role="倉庫">倉庫人員</div>
    <div class="chip" data-role="工廠">工廠人員</div>
  </div>

  <div class="banner">設定完成後，系統會記住您的 LINE 帳號與姓名，之後叫貨、驗收畫面會自動帶入您的姓名，不用重複輸入。</div>

  <button class="primary-btn" id="bind-submit-btn">完成設定</button>
</div>

<div id="main-content" class="wrap" style="display:none;">
  <div class="status-badge">👤 <span id="user-name-display"></span>　<span id="user-role-display"></span></div>

  <div class="section-label">驗收門市（每次驗收都要選）</div>
  <div class="chip-row" id="store-row">
    <div class="chip sel" data-store="正氣店">正氣店</div>
    <div class="chip" data-store="鐵花館">鐵花館</div>
    <div class="chip" data-store="A倉">A倉</div>
  </div>

  <button id="history-toggle-btn" style="margin-top:10px; width:100%; padding:10px; border-radius:10px; border:1px solid var(--line-border); background:white; color:var(--teal-dark); font-weight:700; font-size:17.5px; cursor:pointer;">📋 查看本門市已完成驗收紀錄</button>
  <div id="history-panel" style="display:none; margin-top:8px;"></div>

  <div class="section-label" style="display:flex; justify-content:space-between; align-items:center;">
    <span>待驗收清單</span>
    <span style="cursor:pointer; color:var(--teal-dark); font-weight:700;" onclick="loadShippedOrders()">🔄 重新整理</span>
  </div>
  <div id="shipped-list"></div>
</div>

<script>
// ====== 這兩個值是這個頁面專屬的設定 ======
var LIFF_ID = '2011319572-LiIfYmfu'; // 門市驗收 LIFF ID
var API_URL = 'https://script.google.com/macros/s/AKfycbweSeRSSxbxgqznlzuBibbC6tiKenbwa3Blv7iPIeGngDNfW1GmNLqgtmwAwPXXfsHV/exec';
// ==========================================

var currentUserId = null;
var selectedRole = '門市';

// 呼叫 GAS 的 JSON API（GET，用於讀取）
function apiGet(action, params, onSuccess, onError, retriesLeft){
  if (retriesLeft === undefined) retriesLeft = 2;
  var qs = 'action=' + encodeURIComponent(action);
  for (var k in params) { qs += '&' + k + '=' + encodeURIComponent(params[k]); }
  fetch(API_URL + '?' + qs)
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.ok) onSuccess(json.data);
      else if (onError) onError(json.error);
    })
    .catch(function(err){
      if (retriesLeft > 0) {
        setTimeout(function(){ apiGet(action, params, onSuccess, onError, retriesLeft - 1); }, 800);
      } else if (onError) onError(err);
    });
}

// 呼叫 GAS 的 JSON API（POST，用於寫入；用 text/plain 避免瀏覽器發出 CORS 預檢請求）
function apiPost(action, payload, onSuccess, onError, retriesLeft){
  if (retriesLeft === undefined) retriesLeft = 2;
  var body = Object.assign({ action: action }, payload);
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.ok) onSuccess(json.data);
      else if (onError) onError(json.error);
    })
    .catch(function(err){
      if (retriesLeft > 0) {
        setTimeout(function(){ apiPost(action, payload, onSuccess, onError, retriesLeft - 1); }, 800);
      } else if (onError) onError(err);
    });
}

document.getElementById('bind-role-row').addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#bind-role-row .chip').forEach(function(c){ c.classList.remove('sel'); });
  chip.classList.add('sel');
  selectedRole = chip.dataset.role;
});

document.getElementById('bind-submit-btn').addEventListener('click', function(){
  var name = document.getElementById('bind-name').value.trim();
  if (!name) { alert('請輸入姓名'); return; }
  this.disabled = true;
  this.textContent = '設定中...';
  var btn = this;
  apiPost('saveUserBinding', { userId: currentUserId, name: name, role: selectedRole }, function(result){
    showMainContent(result.name, result.role);
  }, function(err){
    btn.disabled = false;
    btn.textContent = '完成設定';
    alert('設定失敗，請再試一次：' + err);
  });
});

var RECEIVER_OPTIONS = ['劉亭佑', '許茹文', '方潘璇錚', '陳秀娟', '林孜璇', '賴婷揚', '其他'];
var selectedStore = '正氣店';
var currentReceiver = '';
var receiveState = {}; // orderId -> {qty:{code:qty}, checked:{code:bool}, shipped:{code:qty}}

function showMainContent(name, role){
  document.getElementById('bind-form').style.display = 'none';
  document.getElementById('user-name-display').textContent = name;
  document.getElementById('user-role-display').textContent = '（' + role + '人員）';
  document.getElementById('main-content').style.display = 'block';
  window.currentUserName = name;
  currentReceiver = name;
  bindStoreRow();
  loadShippedOrders();
}

function bindStoreRow(){
  document.getElementById('store-row').addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#store-row .chip').forEach(function(c){ c.classList.remove('sel'); });
    chip.classList.add('sel');
    selectedStore = chip.dataset.store;
    loadShippedOrders();
    if (document.getElementById('history-panel').style.display !== 'none') {
      loadReceiveHistory();
    }
  });
  document.getElementById('history-toggle-btn').addEventListener('click', function(){
    var panel = document.getElementById('history-panel');
    if (panel.style.display === 'none') {
      panel.style.display = 'block';
      loadReceiveHistory();
    } else {
      panel.style.display = 'none';
    }
  });
}

function loadReceiveHistory(){
  var panel = document.getElementById('history-panel');
  panel.innerHTML = '<div class="placeholder-card">載入中...</div>';
  apiGet('getOrdersByStatus', { status: '已完成', limit: 10, store: selectedStore }, function(orders){
    if (!orders || orders.length === 0) {
      panel.innerHTML = '<div class="placeholder-card">' + selectedStore + ' 目前沒有已完成驗收的紀錄</div>';
      return;
    }
    panel.innerHTML = orders.map(function(o){
      var itemsHtml = o.items.map(function(it){
        return it.name + ' x' + it.shipped;
      }).join('<br>');
      return '<div class="history-card">' +
        '<div class="hc-head"><span class="hc-id">' + o.orderId + '</span></div>' +
        '<div class="hc-meta">叫貨人：' + o.orderer + '　驗收人：' + o.receiver + '</div>' +
        '<div class="hc-items">' + itemsHtml + '</div>' +
        '</div>';
    }).join('');
  }, function(err){
    panel.innerHTML = '<div class="placeholder-card">載入失敗，請再試一次</div>';
  });
}

function loadShippedOrders(){
  var list = document.getElementById('shipped-list');
  list.innerHTML = '<div class="placeholder-card">載入中...</div>';
  apiGet('getShippedOrders', { store: selectedStore }, function(orders){
    if (!orders || orders.length === 0) {
      list.innerHTML = '<div class="placeholder-card">' + selectedStore + ' 目前沒有待驗收的叫貨單</div>';
      return;
    }
    receiveState = {};
    list.innerHTML = orders.map(renderShippedCard).join('');
  }, function(err){
    list.innerHTML = '<div class="placeholder-card">載入失敗，請點「重新整理」再試一次</div>';
  });
}

function renderShippedCard(order){
  receiveState[order.orderId] = { qty: {}, checked: {}, shipped: {} };
  order.items.forEach(function(it){
    receiveState[order.orderId].qty[it.code] = it.shippedQty;
    receiveState[order.orderId].shipped[it.code] = it.shippedQty;
    receiveState[order.orderId].checked[it.code] = false;
  });

  var itemsHtml = order.items.map(function(it){
    return '<div class="receive-item" id="ritem-' + order.orderId + '-' + it.code + '">' +
      '<div class="check-circle" onclick="toggleCheck(\'' + order.orderId + '\',\'' + it.code + '\')" id="chk-' + order.orderId + '-' + it.code + '">✓</div>' +
      '<div class="receive-info"><div class="name">' + it.name + '</div>' +
      '<div class="meta">' + it.spec + '　出貨數量：' + it.shippedQty + '</div></div>' +
      '<div class="qtybox-wrap"><div class="qty-box" id="qbox-' + order.orderId + '-' + it.code + '" onclick="openQtyInput(\'' + order.orderId + '\',\'' + it.code + '\')">' + it.shippedQty + '</div></div>' +
      '</div>';
  }).join('');

  var receiverOptionsHtml = RECEIVER_OPTIONS.map(function(r){
    return '<div class="chip" onclick="selReceiver(\'' + order.orderId + '\',this,\'' + r + '\')">' + r + '</div>';
  }).join('');

  return '<div class="order-card" id="order-' + order.orderId + '">' +
    '<div class="oc-head">' +
    '<div class="oc-id">' + order.orderId + '</div>' +
    '<div class="oc-meta">出貨時間：' + order.time + '　配送人員：' + order.deliverer + '</div>' +
    '</div>' +
    itemsHtml +
    '<div class="receiver-auto" id="receiver-auto-' + order.orderId + '">' +
    '<div class="receiver-name">👤 <span id="receiver-name-' + order.orderId + '">' + currentReceiver + '</span><span class="receiver-tag">目前 LINE 帳號</span></div>' +
    '<button class="switch-link" onclick="toggleReceiverSwitch(\'' + order.orderId + '\')">不是我，換人 →</button>' +
    '</div>' +
    '<div id="receiver-switch-' + order.orderId + '" class="chip-row" style="display:none; margin-top:8px;">' + receiverOptionsHtml + '</div>' +
    '<button class="receive-submit-btn" id="submitbtn-' + order.orderId + '" onclick="submitReceiveOrder(\'' + order.orderId + '\')">確認驗收 送出</button>' +
    '</div>';
}

function toggleCheck(orderId, code){
  var s = receiveState[orderId];
  s.checked[code] = !s.checked[code];
  document.getElementById('chk-' + orderId + '-' + code).classList.toggle('on', s.checked[code]);
  document.getElementById('ritem-' + orderId + '-' + code).style.background = s.checked[code] ? 'var(--teal-light)' : 'transparent';
}

function openQtyInput(orderId, code){
  var box = document.getElementById('qbox-' + orderId + '-' + code);
  if (!box) return;
  var current = box.textContent.trim();
  box.outerHTML = '<input type="number" inputmode="numeric" pattern="[0-9]*" class="qty-input" id="qbox-' + orderId + '-' + code + '" value="' + current + '" onblur="commitQtyInput(\'' + orderId + '\',\'' + code + '\')" onkeydown="if(event.key===\'Enter\'){this.blur();}">';
  var input = document.getElementById('qbox-' + orderId + '-' + code);
  input.focus();
  input.select();
}

function commitQtyInput(orderId, code){
  var input = document.getElementById('qbox-' + orderId + '-' + code);
  if (!input) return;
  var val = parseInt(input.value, 10);
  if (isNaN(val) || val < 0) val = 0;
  receiveState[orderId].qty[code] = val;
  input.outerHTML = '<div class="qty-box" id="qbox-' + orderId + '-' + code + '" onclick="openQtyInput(\'' + orderId + '\',\'' + code + '\')">' + val + '</div>';
}

function toggleReceiverSwitch(orderId){
  var el = document.getElementById('receiver-switch-' + orderId);
  el.style.display = (el.style.display === 'none') ? 'flex' : 'none';
  el.style.flexWrap = 'wrap';
}

function selReceiver(orderId, elm, name){
  document.querySelectorAll('#receiver-switch-' + orderId + ' .chip').forEach(function(c){ c.classList.remove('sel'); });
  elm.classList.add('sel');
  document.getElementById('receiver-name-' + orderId).textContent = name;
  document.querySelector('#receiver-auto-' + orderId + ' .receiver-tag').textContent = '手動更換';
  document.getElementById('receiver-switch-' + orderId).style.display = 'none';
  receiveState[orderId].receiverOverride = name;
}

function submitReceiveOrder(orderId){
  var s = receiveState[orderId];
  var receiverName = s.receiverOverride || currentReceiver;
  var items = Object.keys(s.qty).map(function(code){ return { code: code, qty: s.qty[code] }; });

  var btn = document.getElementById('submitbtn-' + orderId);
  btn.disabled = true;
  btn.textContent = '送出中...';
  apiPost('submitReceive', {
    userId: currentUserId,
    name: window.currentUserName,
    orderId: orderId,
    receiverName: receiverName,
    items: JSON.stringify(items)
  }, function(result){
    var card = document.getElementById('order-' + orderId);
    var doneMsg = result.delivered
      ? ('✅ ' + orderId + ' 驗收完成，已寫入批次編號 ' + result.trId)
      : ('✅ ' + orderId + ' 已確認完成，本次品項皆未到貨（未寫入門市進貨單）');
    card.outerHTML = '<div class="placeholder-card" style="border-color:var(--teal); border-style:solid;">' + doneMsg + '</div>';
  }, function(err){
    btn.disabled = false;
    btn.textContent = '確認驗收 送出';
    alert('送出失敗，請再試一次：' + err);
  });
}

function init(){
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    return liff.getProfile();
  }).then(function(profile){
    if (!profile) return;
    currentUserId = profile.userId;
    document.getElementById('loading').style.display = 'none';

    apiGet('getUserBinding', { userId: currentUserId }, function(binding){
      if (binding) {
        showMainContent(binding.name, binding.role);
      } else {
        document.getElementById('bind-form').style.display = 'block';
      }
    }, function(err){
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').textContent = '連線失敗，請重新整理再試一次';
    });
  }).catch(function(err){
    document.getElementById('loading').textContent = '請在 LINE App 內開啟此頁面';
  });
}

init();
</script>
</body>
</html>
