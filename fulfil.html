<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倉庫備貨</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --teal:#0f6f66; --teal-dark:#0a4f49; --teal-light:#e4f0ee;
    --gold:#c9932e; --gold-light:#f7ecd4; --cream:#faf6ee;
    --ink:#2b2622; --ink-soft:#6b6259; --line-border:#e6ddce;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); padding-bottom:40px; line-height:1.5;}
  .topbar{background:var(--teal); color:white; padding:18px; }
  .topbar h1{margin:2px 0 0; font-size:21px; font-weight:800;}
  .topbar .sub{font-size:15.5px; opacity:0.9; margin-top:4px;}
  .wrap{padding:16px 18px;}
  .section-label{font-size:16.5px; font-weight:800; color:var(--teal-dark); letter-spacing:1px; margin:14px 0 6px;}
  input[type=text]{
    width:100%; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line-border);
    font-size:17.5px; background:white;
  }
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    padding:12px 18px; border-radius:12px; border:1.5px solid var(--line-border);
    background:white; font-weight:700; font-size:15.5px; color:var(--ink-soft); cursor:pointer;
  }
  .chip.sel{background:var(--teal); border-color:var(--teal); color:white;}
  .primary-btn{
    width:100%; background:var(--teal); color:white; border:none; padding:16px;
    border-radius:12px; font-size:17px; font-weight:800; cursor:pointer; margin-top:18px;
  }
  .primary-btn:disabled{background:#c9c2b5;}
  .banner{
    background:var(--gold-light); border:1px solid var(--gold); border-radius:10px;
    padding:10px 12px; font-size:16.5px; color:#6b4f10; line-height:1.5; margin-top:14px;
  }
  .status-badge{
    display:inline-flex; align-items:center; gap:6px; background:var(--teal-light);
    color:var(--teal-dark); padding:8px 14px; border-radius:999px; font-weight:800; font-size:16.5px;
  }
  .loading{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:15.5px;}
  .placeholder-card{
    margin-top:20px; background:white; border:1.5px dashed var(--line-border);
    border-radius:14px; padding:24px; text-align:center; color:var(--ink-soft); font-size:16.5px; line-height:1.7;
  }
  .order-card{
    background:white; border:1.5px solid var(--line-border); border-radius:14px; padding:14px; margin-bottom:14px;
  }
  .order-card .oc-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .order-card .oc-id{font-size:16.5px; font-weight:800; color:var(--teal-dark);}
  .order-card .oc-meta{font-size:16.5px; color:var(--ink-soft); margin-top:2px;}
  .order-card .oc-store{
    background:var(--gold-light); color:#7a5b13; font-size:17.5px; font-weight:800;
    padding:3px 10px; border-radius:999px; flex-shrink:0;
  }
  .fulfil-item{border-top:1px dashed var(--line-border); padding:10px 0;}
  .fulfil-item .fi-name{font-weight:700; font-size:15.5px;}
  .fulfil-item .fi-spec{font-size:16.5px; color:var(--ink-soft); margin:2px 0 8px;}
  .fulfil-row{display:flex; align-items:center; justify-content:space-between;}
  .fulfil-row .ordered{font-size:16.5px; color:var(--ink-soft);}
  .fulfil-row .ordered b{color:var(--ink);}
  .qtybox-wrap{display:flex; align-items:center; gap:6px;}
  .qty-box{
    min-width:50px; text-align:center; padding:9px 12px; border-radius:10px; background:var(--teal);
    color:white; font-weight:800; font-size:15.5px; cursor:pointer;
  }
  .qty-input{
    width:62px; text-align:center; padding:7px 4px; border-radius:10px; border:1.5px solid var(--gold);
    font-weight:800; font-size:15.5px; background:var(--gold-light);
  }
  .wh-row{display:flex; gap:6px; margin-top:8px;}
  .wh-pill{
    padding:5px 10px; border-radius:8px; border:1px solid var(--line-border); background:var(--cream);
    font-size:17.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .wh-pill.sel{background:var(--teal-light); border-color:var(--teal); color:var(--teal-dark);}
  .short-flag{
    margin-top:6px; background:#fbe4de; color:#c0503d; font-size:17.5px; font-weight:700;
    padding:5px 9px; border-radius:8px; display:inline-block;
  }
  .fulfil-submit-btn{
    width:100%; background:var(--teal); color:white; border:none; padding:15px;
    border-radius:12px; font-size:16.5px; font-weight:800; cursor:pointer; margin-top:12px;
  }
  .fulfil-submit-btn:disabled{background:#c9c2b5;}
  .history-card{
    background:white; border:1.5px solid var(--line-border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
  }
  .history-card .hc-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .history-card .hc-id{font-size:15.5px; font-weight:800; color:var(--teal-dark);}
  .history-card .hc-meta{font-size:17.5px; color:var(--ink-soft);}
  .history-card .hc-store{font-size:15.5px; font-weight:800; background:var(--gold-light); color:#7a5b13; padding:2px 8px; border-radius:999px;}
  .history-card .hc-items{font-size:15.5px; color:var(--ink); line-height:1.7; margin-top:6px;}
  .history-card .hc-items .short{color:#c0503d; font-weight:700;}
</style>
</head>
<body>

<div class="topbar">
  <div style="font-size:17.5px; opacity:0.85; letter-spacing:1px; text-transform:uppercase;">LINE｜倉庫工廠備貨群組</div>
  <h1>備貨確認</h1>
  <div class="sub">確認出貨數量與轉出倉別 → 送出</div>
</div>

<div id="loading" class="loading">載入中...</div>

<div id="bind-form" class="wrap" style="display:none;">
  <div class="section-label">您的姓名</div>
  <input type="text" id="bind-name" placeholder="請輸入姓名">

  <div class="section-label">您的角色</div>
  <div class="chip-row" id="bind-role-row">
    <div class="chip" data-role="門市">門市人員</div>
    <div class="chip sel" data-role="倉庫">倉庫人員</div>
    <div class="chip" data-role="工廠">工廠人員</div>
  </div>

  <div class="banner">設定完成後，系統會記住您的 LINE 帳號與姓名，之後叫貨、驗收畫面會自動帶入您的姓名，不用重複輸入。</div>

  <button class="primary-btn" id="bind-submit-btn">完成設定</button>
</div>

<div id="main-content" class="wrap" style="display:none;">
  <div class="status-badge">👤 <span id="user-name-display"></span>　<span id="user-role-display"></span></div>

  <button id="history-toggle-btn" style="margin-top:10px; width:100%; padding:10px; border-radius:10px; border:1px solid var(--line-border); background:white; color:var(--teal-dark); font-weight:700; font-size:17.5px; cursor:pointer;">📋 查看最近已出貨紀錄</button>
  <div id="history-panel" style="display:none; margin-top:8px;"></div>

  <div class="section-label" style="display:flex; justify-content:space-between; align-items:center;">
    <span>待備貨清單</span>
    <span style="cursor:pointer; color:var(--teal-dark); font-weight:700;" onclick="loadPendingOrders()">🔄 重新整理</span>
  </div>
  <div id="pending-list"></div>
</div>

<script>
// ====== 這兩個值是這個頁面專屬的設定 ======
var LIFF_ID = '2011319572-vQ128E4o'; // 倉庫備貨 LIFF ID
var API_URL = 'https://script.google.com/macros/s/AKfycbweSeRSSxbxgqznlzuBibbC6tiKenbwa3Blv7iPIeGngDNfW1GmNLqgtmwAwPXXfsHV/exec';
// ==========================================

var currentUserId = null;
var selectedRole = '倉庫';

// 呼叫 GAS 的 JSON API（GET，用於讀取）
function apiGet(action, params, onSuccess, onError, retriesLeft){
  if (retriesLeft === undefined) retriesLeft = 2;
  var qs = 'action=' + encodeURIComponent(action);
  for (var k in params) { qs += '&' + k + '=' + encodeURIComponent(params[k]); }
  fetch(API_URL + '?' + qs)
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.ok) onSuccess(json.data);
      else if (onError) onError(json.error);
    })
    .catch(function(err){
      if (retriesLeft > 0) {
        setTimeout(function(){ apiGet(action, params, onSuccess, onError, retriesLeft - 1); }, 800);
      } else if (onError) onError(err);
    });
}

// 呼叫 GAS 的 JSON API（POST，用於寫入；用 text/plain 避免瀏覽器發出 CORS 預檢請求）
function apiPost(action, payload, onSuccess, onError, retriesLeft){
  if (retriesLeft === undefined) retriesLeft = 2;
  var body = Object.assign({ action: action }, payload);
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.ok) onSuccess(json.data);
      else if (onError) onError(json.error);
    })
    .catch(function(err){
      if (retriesLeft > 0) {
        setTimeout(function(){ apiPost(action, payload, onSuccess, onError, retriesLeft - 1); }, 800);
      } else if (onError) onError(err);
    });
}

document.getElementById('bind-role-row').addEventListener('click', function(e){
  var chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('#bind-role-row .chip').forEach(function(c){ c.classList.remove('sel'); });
  chip.classList.add('sel');
  selectedRole = chip.dataset.role;
});

document.getElementById('bind-submit-btn').addEventListener('click', function(){
  var name = document.getElementById('bind-name').value.trim();
  if (!name) { alert('請輸入姓名'); return; }
  this.disabled = true;
  this.textContent = '設定中...';
  var btn = this;
  apiPost('saveUserBinding', { userId: currentUserId, name: name, role: selectedRole }, function(result){
    showMainContent(result.name, result.role);
  }, function(err){
    btn.disabled = false;
    btn.textContent = '完成設定';
    alert('設定失敗，請再試一次：' + err);
  });
});

var WAREHOUSES = ['A倉', 'B倉', 'CC倉'];
var orderState = {}; // orderId -> {qty:{code:qty}, wh:{code:warehouse}, ordered:{code:qty}}

function showMainContent(name, role){
  document.getElementById('bind-form').style.display = 'none';
  document.getElementById('user-name-display').textContent = name;
  document.getElementById('user-role-display').textContent = '（' + role + '人員）';
  document.getElementById('main-content').style.display = 'block';
  window.currentUserName = name;
  loadPendingOrders();
}

function loadPendingOrders(){
  var list = document.getElementById('pending-list');
  list.innerHTML = '<div class="placeholder-card">載入中...</div>';
  apiGet('getPendingOrders', {}, function(orders){
    if (!orders || orders.length === 0) {
      list.innerHTML = '<div class="placeholder-card">目前沒有待備貨的叫貨單 👍</div>';
      return;
    }
    orderState = {};
    list.innerHTML = orders.map(renderOrderCard).join('');
  }, function(err){
    list.innerHTML = '<div class="placeholder-card">載入失敗，請點「重新整理」再試一次</div>';
  });
}

document.getElementById('history-toggle-btn').addEventListener('click', function(){
  var panel = document.getElementById('history-panel');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    loadFulfilHistory();
  } else {
    panel.style.display = 'none';
  }
});

function loadFulfilHistory(){
  var panel = document.getElementById('history-panel');
  panel.innerHTML = '<div class="placeholder-card">載入中...</div>';
  apiGet('getOrdersByStatus', { status: '已出貨', limit: 10 }, function(orders){
    if (!orders || orders.length === 0) {
      panel.innerHTML = '<div class="placeholder-card">目前沒有已出貨的紀錄</div>';
      return;
    }
    panel.innerHTML = orders.map(function(o){
      var itemsHtml = o.items.map(function(it){
        var shortFlag = '';
        if (it.shipped !== '' && it.shipped !== null && Number(it.shipped) < Number(it.qty)) {
          shortFlag = ' <span class="short">（缺' + (it.qty - it.shipped) + '）</span>';
        }
        return it.name + ' x' + it.shipped + shortFlag + '　[' + (it.warehouse || '-') + ']';
      }).join('<br>');
      return '<div class="history-card">' +
        '<div class="hc-head"><span class="hc-id">' + o.orderId + '</span><span class="hc-store">' + o.store + '</span></div>' +
        '<div class="hc-meta">叫貨人：' + o.orderer + '　備貨人：' + o.deliverer + '</div>' +
        '<div class="hc-items">' + itemsHtml + '</div>' +
        '</div>';
    }).join('');
  }, function(err){
    panel.innerHTML = '<div class="placeholder-card">載入失敗，請再試一次</div>';
  });
}

function renderOrderCard(order){
  orderState[order.orderId] = { qty: {}, wh: {}, ordered: {} };
  order.items.forEach(function(it){
    orderState[order.orderId].qty[it.code] = it.qty;
    orderState[order.orderId].wh[it.code] = 'A倉';
    orderState[order.orderId].ordered[it.code] = it.qty;
  });

  var itemsHtml = order.items.map(function(it){
    var whPills = WAREHOUSES.map(function(w, idx){
      return '<div class="wh-pill' + (idx===0?' sel':'') + '" onclick="selItemWarehouse(\'' + order.orderId + '\',\'' + it.code + '\',this,\'' + w + '\')">' + w + '</div>';
    }).join('');
    return '<div class="fulfil-item">' +
      '<div class="fi-name">' + it.name + '</div>' +
      '<div class="fi-spec">' + it.spec + '　' + it.code + '</div>' +
      '<div class="fulfil-row">' +
      '<div class="ordered">叫貨數量：<b>' + it.qty + '</b></div>' +
      '<div class="qtybox-wrap">' +
      '<div class="qty-box" id="qbox-' + order.orderId + '-' + it.code + '" onclick="openQtyInput(\'' + order.orderId + '\',\'' + it.code + '\')">' + it.qty + '</div>' +
      '</div></div>' +
      '<div class="wh-row" id="wh-' + order.orderId + '-' + it.code + '">' + whPills + '</div>' +
      '<div class="short-flag" id="short-' + order.orderId + '-' + it.code + '" style="display:none;"></div>' +
      '</div>';
  }).join('');

  return '<div class="order-card" id="order-' + order.orderId + '">' +
    '<div class="oc-head">' +
    '<div><div class="oc-id">' + order.orderId + '</div><div class="oc-meta">' + order.time + '　叫貨人：' + order.orderer + '</div></div>' +
    '<div class="oc-store">' + order.store + '</div>' +
    '</div>' +
    itemsHtml +
    '<button class="fulfil-submit-btn" id="submitbtn-' + order.orderId + '" onclick="submitFulfilOrder(\'' + order.orderId + '\')">確認出貨</button>' +
    '</div>';
}

function selItemWarehouse(orderId, code, elm, w){
  document.querySelectorAll('#wh-' + orderId + '-' + code + ' .wh-pill').forEach(function(x){ x.classList.remove('sel'); });
  elm.classList.add('sel');
  orderState[orderId].wh[code] = w;
}

function openQtyInput(orderId, code){
  var box = document.getElementById('qbox-' + orderId + '-' + code);
  if (!box) return;
  var current = box.textContent.trim();
  box.outerHTML = '<input type="number" inputmode="numeric" pattern="[0-9]*" class="qty-input" id="qbox-' + orderId + '-' + code + '" value="' + current + '" onblur="commitQtyInput(\'' + orderId + '\',\'' + code + '\')" onkeydown="if(event.key===\'Enter\'){this.blur();}">';
  var input = document.getElementById('qbox-' + orderId + '-' + code);
  input.focus();
  input.select();
}

function commitQtyInput(orderId, code){
  var input = document.getElementById('qbox-' + orderId + '-' + code);
  if (!input) return;
  var val = parseInt(input.value, 10);
  if (isNaN(val) || val < 0) val = 0;
  orderState[orderId].qty[code] = val;
  input.outerHTML = '<div class="qty-box" id="qbox-' + orderId + '-' + code + '" onclick="openQtyInput(\'' + orderId + '\',\'' + code + '\')">' + val + '</div>';

  var ordered = orderState[orderId].ordered[code];
  var flag = document.getElementById('short-' + orderId + '-' + code);
  if (val < ordered) {
    flag.style.display = 'inline-block';
    flag.textContent = '⚠ 今日缺貨 ' + (ordered - val) + '（原叫貨 ' + ordered + '，出貨 ' + val + '）';
  } else {
    flag.style.display = 'none';
  }
}

function submitFulfilOrder(orderId){
  var state = orderState[orderId];
  var items = Object.keys(state.qty).map(function(code){
    return { code: code, qty: state.qty[code], warehouse: state.wh[code] };
  });
  var btn = document.getElementById('submitbtn-' + orderId);
  btn.disabled = true;
  btn.textContent = '送出中...';
  apiPost('submitFulfil', {
    userId: currentUserId,
    name: window.currentUserName,
    orderId: orderId,
    items: JSON.stringify(items)
  }, function(result){
    var card = document.getElementById('order-' + orderId);
    var note = result.shortCount > 0 ? '（' + result.shortCount + ' 項今日缺貨）' : '';
    card.outerHTML = '<div class="placeholder-card" style="border-color:var(--teal); border-style:solid;">✅ ' + orderId + ' 已完成出貨 ' + note + '</div>';
  }, function(err){
    btn.disabled = false;
    btn.textContent = '確認出貨';
    alert('送出失敗，請再試一次：' + err);
  });
}

function init(){
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    return liff.getProfile();
  }).then(function(profile){
    if (!profile) return;
    currentUserId = profile.userId;
    document.getElementById('loading').style.display = 'none';

    apiGet('getUserBinding', { userId: currentUserId }, function(binding){
      if (binding) {
        showMainContent(binding.name, binding.role);
      } else {
        document.getElementById('bind-form').style.display = 'block';
      }
    }, function(err){
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').textContent = '連線失敗，請重新整理再試一次';
    });
  }).catch(function(err){
    document.getElementById('loading').textContent = '請在 LINE App 內開啟此頁面';
  });
}

init();
</script>
</body>
</html>
